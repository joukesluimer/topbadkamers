<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>Render · terrazzo badkamer</title>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
</head>
<body>
<script type="module">
import * as C from './b4-common.js';
const { THREE } = C;
C.pageStyle();

// Terrazzo badkamer: warme terrazzo met terracotta, roze en grijze korrels op vloer, douchewand en blad,
// zachte terracotta kalkverf, eiken meubel, opzetkom in terracotta, messing kranen.
const room = { w: 3.2, d: 3.6, h: 2.6 };
const { renderer, scene, camera } = C.setup({ exposure: 0.97, fov: 56 });

const korrels = ['#c4704f', '#d99a7c', '#e8c4b0', '#9a948c', '#5f5a55', '#f6f1ea', '#b5543a', '#d8cfc4'];
const terrazzo = C.tileMaterial({ pattern: 'grid', tw: 0.6, th: 0.6, joint: 0.0018, base: '#ebe2d7', varL: 0.006, grout: '#ddd2c4', gloss: 0.3, seed: 61, surface: C.SURF.terrazzoRijk(korrels, { dens: 75, max: 17 }), periodX: 1.2, periodY: 1.2, clearcoat: 0.35, normalScale: 0.3, ppm: 1400 });
const terraBlad = C.tileMaterial({ pattern: 'grid', tw: 1.2, th: 1.2, joint: 0.0001, base: '#ebe2d7', varL: 0.0, grout: '#ebe2d7', gloss: 0.25, seed: 62, surface: C.SURF.terrazzoRijk(korrels, { dens: 65, max: 15 }), periodX: 1.2, periodY: 1.2, clearcoat: 0.5, normalScale: 0.1, ppm: 1400 });
const verf = C.plasterMaterial('#e3bfa8', { cloud: 0.04, seed: 8, roughness: 0.9 });
const plafond = C.plasterMaterial('#f3eee8', { cloud: 0.015 });
const eiken = C.woodMaterial({ base: '#c9a074', seed: 63, size: 0.9, contrast: 0.13, roughness: 0.55 });
const terracotta = C.matteMaterial('#b8603f', 0.7);

C.floorCeil(scene, room, terrazzo, plafond);
const raam = { u0: 1.55, u1: 2.45, v0: 1.3, v1: 2.3 };
const nis = { u0: 0.22, u1: 0.82, v0: 1.0, v1: 1.35 };
C.wall(scene, room, 'back', (u) => (u < 1.02 ? terrazzo : terrazzo), (u) => (u < 1.02 ? terrazzo : verf), 1.2, [nis], 0.12, [1.02]);
C.wall(scene, room, 'left', terrazzo, (u) => (u < 1.0 ? terrazzo : verf), 1.2, [raam], 0.12, [1.0]);
C.wall(scene, room, 'right', verf, verf, room.h, []);
C.niche(scene, nis, terraBlad, 0.09);
C.windowLight(scene, room, 'left', raam, { frame: '#c9a074', reveal: verf, sill: terraBlad, sunDir: [-1.0, 1.0, 0.5], sun: 5.5, fill: 1.3, glowI: 1.45 });

scene.add(C.shower('messing', 0.52, room.h, { armY: 2.15, reach: 0.4, headR: 0.15, mixY: 1.0, handX: 0.32 }));
scene.add(C.drain(0.52, 0.1, 0.8, 'messing'));
const glas = C.glassPanel({ len: 1.0, h: 2.0, wallProfile: C.metalMaterial('messing'), stab: C.metalMaterial('messing'), stabLen: 1.02 });
glas.position.set(1.02, 0, 0); scene.add(glas);
scene.add(C.bottle(C.matteMaterial('#f1e8de', 0.4), 0.4, 1.0, -0.045, 0.16, 0.028));
scene.add(C.bottle(C.matteMaterial('#b8603f', 0.4), 0.5, 1.0, -0.045, 0.13, 0.026));

const mx = 1.98;
const meubel = C.vanity({ type: 'zwevend', w: 1.1, d: 0.46, h: 0.38, top: 0.85, mat: eiken, blad: terraBlad, bladT: 0.04, sink: 'opzet', bowlR: 0.2, bowlShape: 'rond', bowlScale: [1.0, 0.85], bowlMat: terracotta, drawers: 1, handle: C.metalMaterial('messing') });
meubel.position.set(mx, 0, 0); scene.add(meubel);
scene.add(C.tap('wand', 'messing', mx, 0.85, 0, 0.19));
// wandkraan zit hoger dan de kom: iets lager zetten
const sp = C.mirror(0.72, 0.72, 'rond', C.metalMaterial('messing'), 0.012); sp.position.set(mx, 1.65, 0); scene.add(sp);
C.sconce(scene, 'messing', mx + 0.55, 1.65, 0, C.KELVIN.warm, 0.7);
scene.add(C.bottle(C.matteMaterial('#e8c4b0', 0.5), mx + 0.38, 0.85, 0.14, 0.12, 0.035));
scene.add(C.stool(eiken, 2.85, 0.85, 0.45, 0.16));
scene.add(C.towelStack([C.fabricMaterial('#d99a7c'), C.fabricMaterial('#efe7dc')], 2.85, 0.45, 0.85, 0.26, 0.2));
scene.add(C.plant(2.92, 0.3, { potMat: terracotta, h: 0.65, seed: 64, potR: 0.14, potH: 0.32 }));
const wc = C.toilet(); wc.rotation.y = Math.PI / 2; wc.position.set(0, 0, 2.0); scene.add(wc);
const plate = C.flushPlate('messing', 0, 1.05, 0); plate.rotation.y = Math.PI / 2; plate.position.set(0, 0, 2.0); scene.add(plate);

const warm = C.KELVIN.warm;
C.spot(scene, 0.52, 0.35, room.h, warm, 5.5, { shadow: true, angle: 0.85 });
C.spot(scene, mx, 0.3, room.h, warm, 5, { shadow: true, angle: 0.85 });
C.spot(scene, 1.6, 1.9, room.h, warm, 3.5, {});
scene.add(new THREE.HemisphereLight('#f6eee4', '#6b5a4e', 0.22));

if (C.VIEW === 2) C.viewCamera(camera, [1.7, 1.2, 1.55], [2.05, 0, 0], -0.08, 46);
else C.viewCamera(camera, [2.8, 1.35, 3.45], [0.95, 0, 0.25], -0.035);
await C.finish(renderer, scene, camera, `b4-terrazzo-badkamer-${C.VIEW}`, { aoRadius: 0.4, aoIntensity: 1.2, envScale: 0.6 });
</script>
</body>
</html>
