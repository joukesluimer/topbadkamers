<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>Render · marmer badkamer (path tracing)</title>
<script type="importmap">{"imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
  "three/examples/jsm/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
  "three-mesh-bvh":"https://cdn.jsdelivr.net/npm/three-mesh-bvh@0.7.6/src/index.js",
  "three-gpu-pathtracer":"https://cdn.jsdelivr.net/npm/three-gpu-pathtracer@0.0.23/src/index.js"
}}</script>
</head>
<body>
<script>
// fouten en voortgang naar de server (headless controle)
const _log = (m) => fetch('/log', { method: 'POST', body: String(m) }).catch(() => {});
addEventListener('error', (e) => _log('FOUT ' + e.message + ' ' + (e.filename || '') + ':' + (e.lineno || '')));
addEventListener('unhandledrejection', (e) => _log('FOUT ' + (e.reason && (e.reason.stack || e.reason))));
for (const k of ['error', 'warn']) { const f = console[k]; console[k] = (...a) => { _log(k.toUpperCase() + ' ' + a.join(' ').slice(0, 600)); f.apply(console, a); }; }
_log('pagina geladen');
</script>
<script type="module">
// Fotorealistische marmerbadkamer, gerenderd met three-gpu-pathtracer (alleen in deze renderpagina).
// Standaard: rasterversie (snel). ?pt=1: path tracing (traag in swiftshader).
// Parameters: ?view=1|2  ?spp=<monsters>  ?w=<breedte> (test)  ?auto=1 (export naar de server)
import * as C from './b6-marmer-common.js';
const { THREE } = C;
C.pageStyle();
fetch('/log', { method: 'POST', body: 'modules geladen' });
const P = new URLSearchParams(location.search);
const W = Number(P.get('w') || (P.has('pt') ? 1600 : 2400)); // raster: 1,5x supersampling

const room = { w: 3.4, d: 3.8, h: 2.6 };
const { renderer, scene, camera } = C.setup({ exposure: Number(P.get('exp') || 0.85), fov: 54, w: W, h: Math.round(W / 1.5) });

// Calacatta-platen 120 x 260, book-matched; vloer in tegels van 120 x 120
const wandA = C.marbleMaterial({ seed: 11, angle: 1.05, period: 1.7 });
const wandB = C.marbleMaterial({ seed: 23, angle: 0.75, period: 1.8, ox: 3.1, oy: 1.7 });
const vloer = C.marbleMaterial({ tiles: true, slabW: 1.2, slabH: 1.2, nx: 2, ny: 2, seed: 37, angle: 0.5, period: 1.4, scale: 1.0,
  base: [238, 234, 227], roughness: 0.3, clearcoat: 0.7, clearcoatRoughness: 0.06, joint: 0.002 });
const plafond = C.plasterMaterial('#f3f1ed', { cloud: 0.01 });
const walnoot = C.woodMaterial({ base: '#6a4630', seed: 41, size: 0.8, contrast: 0.2, roughness: 0.42, clearcoat: 0.35 });
const goud = new THREE.MeshPhysicalMaterial({ color: '#dcb878', metalness: 1, roughness: 0.2 });
const goudMat = new THREE.MeshPhysicalMaterial({ color: '#cfae72', metalness: 1, roughness: 0.38 });
const doek = (hex) => new THREE.MeshPhysicalMaterial({ color: hex, roughness: 1, sheen: 1, sheenColor: '#ffffff', sheenRoughness: 0.7 });
const keramiek = new THREE.MeshPhysicalMaterial({ color: '#f6f5f2', roughness: 0.12, clearcoat: 1, clearcoatRoughness: 0.04 });

C.floorCeil(scene, room, vloer, plafond);
const raam = { u0: 1.75, u1: 2.75, v0: 1.2, v1: 2.3 };
const nis = { u0: 0.22, u1: 0.82, v0: 1.0, v1: 1.35 };
const deur = { u0: 0.35, u1: 1.2, v0: 0, v1: 2.1 };
C.wall(scene, room, 'back', wandA, wandA, room.h, [nis]);
C.wall(scene, room, 'left', wandB, wandB, room.h, [raam]);
C.wall(scene, room, 'right', wandB, wandB, room.h, []);
// voorwand (achter de camera; zichtbaar in de spiegel) met deur
if (!P.has('nofront')) {
  const T = 0.12, H = room.h;
  scene.add(C.boxMM(0, 0, room.d, deur.u0, H, room.d + T, wandB));
  scene.add(C.boxMM(deur.u1, 0, room.d, room.w, H, room.d + T, wandB));
  scene.add(C.boxMM(deur.u0, deur.v1, room.d, deur.u1, H, room.d + T, wandB));
  const deurMat = C.matteMaterial('#ece9e3', 0.5);
  scene.add(C.boxMM(deur.u0, 0, room.d + 0.03, deur.u1, deur.v1, room.d + 0.07, deurMat));
  scene.add(C.boxMM(deur.u1 - 0.12, 1.02, room.d - 0.03, deur.u1 - 0.07, 1.04, room.d + 0.03, goud));
}
C.niche(scene, nis, vloer, 0.09);
C.windowLight(scene, room, 'left', raam, { frame: '#ebe8e2', reveal: wandB, sill: vloer, intensity: Number(P.get('win') || 14), glowI: 3.2 });

// inloopdouche linksachter met gouden profiel en helder glas
scene.add(C.shower('goud', 0.55, room.h, { armY: 2.2, reach: 0.42, headR: 0.16, mixY: 1.05, handX: 0.3 }));
scene.add(C.drain(0.55, 0.1, 0.8, 'goud'));
const glas = C.glassPanel({ len: 1.1, h: 2.05, wallProfile: goud, stab: goud, stabLen: 1.08, stabSide: 1 });
glas.position.set(1.1, 0, 0); scene.add(glas);
scene.add(C.bottle(C.matteMaterial('#efe9df', 0.35), 0.42, 1.0, -0.045, 0.17, 0.028, goud));
scene.add(C.bottle(C.matteMaterial('#5d564d', 0.35), 0.53, 1.0, -0.045, 0.14, 0.026, goud));

// vrijstaand bad onder het raam
const bad = C.bath({ L: 1.6, W: 0.76, H: 0.58, outer: keramiek });
bad.rotation.y = Math.PI / 2; bad.position.set(0.6, 0, 2.25); scene.add(bad);
scene.add(C.bathFiller('goud', 0.6, 1.3, 0));
scene.add(C.stool(walnoot, 1.3, 1.6, 0.45, 0.15));
scene.add(C.towelStack([doek('#f1ece3'), doek('#d9d0c3')], 1.3, 0.45, 1.6, 0.26, 0.2));

// zwevend walnoten meubel met marmeren blad en opzetkom
const mx = 2.45;
const meubel = C.vanity({ type: 'zwevend', w: 1.3, d: 0.5, h: 0.42, top: 0.88, mat: walnoot, blad: vloer, bladT: 0.04,
  sink: 'opzet', bowlShape: 'rond', bowlR: 0.21, bowlMat: keramiek, drawers: 2, handle: goudMat, metal: 'goud' });
meubel.position.set(mx, 0, 0); scene.add(meubel);
scene.add(C.tap('wand', 'goud', mx, 0.9, 0, 0.24));
C.ledStrip(scene, mx, 0.4, 0.3, 1.2, C.KELVIN.warm, Number(P.get('led') || 6));
const sp = C.mirror(0.76, 0.76, 'rond', goud, 0.018); sp.position.set(mx, 1.66, 0); scene.add(sp);
C.sconce(scene, 'goud', mx - 0.62, 1.68, 0, C.KELVIN.warm, Number(P.get('sc') || 0.9));
C.sconce(scene, 'goud', mx + 0.62, 1.68, 0, C.KELVIN.warm, Number(P.get('sc') || 0.9));
scene.add(C.bottle(C.matteMaterial('#2c2a28', 0.35), mx + 0.47, 0.88, 0.13, 0.16, 0.03, goud));
scene.add(C.towelStack([doek('#f2eee6'), doek('#f2eee6')], mx - 0.45, 0.88, 0.22, 0.26, 0.2));
const rail = C.towelRail('goud', 0, 0.55, 0.5, 1.1, 7); rail.rotation.y = -Math.PI / 2; rail.position.set(room.w, 0, 1.6); scene.add(rail);
const hd = C.towel(doek('#e6dfd3'), 0.42, 0.55, 0, 1.43, 0.06); hd.rotation.y = -Math.PI / 2; hd.position.set(room.w, 0, 1.6); scene.add(hd);

// zachte contactschaduwen (raster): onder bad, kruk, meubel, kom en handdoeken
C.contactShadow(scene, 0.6, 0, 2.25, 0.95, 1.85, 0.6);
C.contactShadow(scene, 0.6, 0, 2.25, 0.72, 1.5, 0.5);
C.contactShadow(scene, 1.3, 0, 1.6, 0.42, 0.42, 0.6);
C.contactShadow(scene, mx, 0, 0.26, 1.6, 0.75, 0.6, 'rect');
C.contactShadow(scene, mx, 0.88, 0.27, 0.48, 0.48, 0.7);
C.contactShadow(scene, mx - 0.45, 0.88, 0.22, 0.34, 0.28, 0.55, 'rect');
C.contactShadow(scene, mx + 0.47, 0.88, 0.13, 0.1, 0.1, 0.6);

// inbouwspots, warm wit (2700 K); dicht bij de wanden voor een zachte lichtboog op het marmer
const warm = C.KELVIN.warm, si = Number(P.get('spot') || 14);
C.spot(scene, 0.55, 0.38, room.h, warm, si, {});
C.spot(scene, mx, 0.4, room.h, warm, si, {});
C.spot(scene, 0.4, 2.3, room.h, warm, si * 0.8, {});
C.spot(scene, 3.0, 2.0, room.h, warm, si * 0.8, {});
C.spot(scene, 1.9, 3.1, room.h, warm, si * 0.6, {});

if (C.VIEW === 2) C.viewCamera(camera, [2.2, 1.45, 1.85], [2.5, 0, 0], -0.05, 44);
else C.viewCamera(camera, [3.12, 1.45, 3.62], [0.95, 0, 0.55], -0.05, 56);
await C.finish(renderer, scene, camera, `b4-marmer-badkamer-${C.VIEW}`, { samples: 300, bounces: 7, vignette: 0.24, grain: 2.0, hemi: 0.08, envScale: 0.6 });
</script>
</body>
</html>
