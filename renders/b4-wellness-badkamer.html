<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>Render · wellness badkamer</title>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
</head>
<body>
<script type="module">
import * as C from './b4-common.js';
const { THREE } = C;
C.pageStyle();

// Wellness badkamer: donkere grote tegels in steenlook, een wand met eiken lamellen achter het meubel,
// een ruime inloopdouche met een betegelde zitbank en een lange nis met warm ledlicht,
// een vierkante regendouche, gedimd warm licht en planten.
const room = { w: 3.6, d: 4.0, h: 2.6 };
const { renderer, scene, camera } = C.setup({ exposure: 1.0, fov: 56 });

const steen = C.tileMaterial({ pattern: 'grid', tw: 0.6, th: 1.2, joint: 0.002, base: '#57534e', varL: 0.015, grout: '#4a4743', gloss: 0.5, seed: 81, surface: C.SURF.betonZacht, periodX: 1.8, periodY: 2.4, speck: 0.05, normalScale: 0.5 });
const vloer = C.tileMaterial({ pattern: 'grid', tw: 0.6, th: 0.6, joint: 0.0025, base: '#4c4945', varL: 0.018, grout: '#3e3c39', gloss: 0.55, seed: 83, surface: C.SURF.betonZacht, periodX: 1.8, periodY: 1.8, speck: 0.05, normalScale: 0.6 });
const zand = C.plasterMaterial('#cdbfae', { cloud: 0.04, seed: 11, roughness: 0.9 });
const plafond = C.plasterMaterial('#d8d1c7', { cloud: 0.015 });
const eiken = C.woodMaterial({ base: '#b88758', seed: 85, size: 0.7, contrast: 0.16, roughness: 0.55 });
const zwart = C.metalMaterial('zwart');

C.floorCeil(scene, room, vloer, plafond);
const nis = { u0: 0.15, u1: 1.35, v0: 1.25, v1: 1.5 };
C.wall(scene, room, 'back', steen, steen, room.h, [nis], 0.12, [1.5]);
C.wall(scene, room, 'left', steen, steen, room.h, []);
C.wall(scene, room, 'right', zand, zand, room.h, []);
C.niche(scene, nis, steen, 0.1);
C.ledStrip(scene, 0.75, 1.49, -0.05, 1.18, C.KELVIN.warm, 1.6);
// lamellenwand achter het meubel
C.slats(scene, 'back', 1.6, room.w - 0.05, 0, room.h, eiken, { w: 0.042, gap: 0.016, depth: 0.03 });

// inloopdouche met zitbank langs de linkerwand
scene.add(C.shower('zwart', 0.75, room.h, { armY: 2.25, reach: 0.42, headR: 0.2, mixY: 1.05, handX: 0.4, square: true }));
const bank = C.boxMM(0, 0, 0.0, 0.45, 0.46, 1.5, steen); scene.add(bank);
scene.add(C.boxMM(0, 0.46, 0.0, 0.47, 0.5, 1.52, vloer));
scene.add(C.drain(1.0, 1.35, 0.9, 'zwart', true));
const glas = C.glassPanel({ len: 1.25, h: 2.05, tint: '#e6e2d8', wallProfile: zwart, stab: zwart, stabLen: 1.48, stabSide: 1 });
glas.position.set(1.5, 0, 0); scene.add(glas);
scene.add(C.towelStack([C.fabricMaterial('#8b7d6c'), C.fabricMaterial('#d8cfc2')], 0.23, 0.5, 1.15, 0.3, 0.22));
for (const [bx, h, c] of [[0.35, 0.16, '#e8dfd2'], [0.46, 0.13, '#3a3530'], [0.56, 0.11, '#a28f78']]) scene.add(C.bottle(C.matteMaterial(c, 0.4), bx, 1.25, -0.05, h, 0.028, zwart));

// meubel voor de lamellen
const mx = 2.6;
const meubel = C.vanity({ type: 'zwevend', w: 1.3, d: 0.5, h: 0.32, top: 0.86, mat: C.matteMaterial('#3b3835', 0.6), blad: steen, bladT: 0.06, sink: 'opzet', bowlR: 0.22, bowlShape: 'rond', bowlScale: [1.0, 0.85], bowlMat: C.matteMaterial('#dcd4c8', 0.5), drawers: 1, handle: null });
meubel.position.set(mx, 0, 0.04); scene.add(meubel);
scene.add(C.tap('hoog', 'zwart', mx, 0.86, 0.11, 0.2));
const sp = C.mirror(0.8, 0.8, 'rond', null); sp.position.set(mx, 1.68, 0.05); scene.add(sp);
const halo = new THREE.Mesh(new THREE.RingGeometry(0.4, 0.43, 96), new THREE.MeshBasicMaterial({ color: new THREE.Color(C.KELVIN.warm).multiplyScalar(1.6) }));
halo.position.set(mx, 1.68, 0.05); scene.add(halo);
const pl = new THREE.PointLight(C.KELVIN.warm, 0.9, 2, 2); pl.position.set(mx, 1.68, 0.2); scene.add(pl);
C.ledStrip(scene, mx, 0.86 - 0.06 - 0.32 - 0.01, 0.38, 1.2, C.KELVIN.warm, 1.0);
scene.add(C.bottle(C.matteMaterial('#2a2725', 0.4), mx + 0.45, 0.86, 0.16, 0.15, 0.03, zwart));
// kaarsen en planten
for (const [cx, cz, ch] of [[mx - 0.48, 0.18, 0.1], [mx - 0.4, 0.26, 0.07]]) {
  scene.add(C.cyl(0.035, 0.035, ch, C.matteMaterial('#efe8dc', 0.8), cx, 0.86 + ch / 2, cz));
  const vl = new THREE.Mesh(new THREE.SphereGeometry(0.008, 12, 8), new THREE.MeshBasicMaterial({ color: '#ffb066' })); vl.position.set(cx, 0.86 + ch + 0.012, cz); scene.add(vl);
}
const kl = new THREE.PointLight('#ffae5c', 0.25, 1.2, 2); kl.position.set(mx - 0.44, 1.02, 0.25); scene.add(kl);
scene.add(C.plant(3.35, 0.9, { potMat: C.matteMaterial('#3a3632', 0.8), h: 0.95, seed: 87, potR: 0.17, potH: 0.4 }));
scene.add(C.plant(1.75, 3.6, { potMat: C.matteMaterial('#b9a891', 0.9), h: 0.7, seed: 89, potR: 0.14 }));
const rail = C.towelRail('zwart', 0, 0.5, 0.5, 1.2, 8); rail.rotation.y = -Math.PI / 2; rail.position.set(room.w, 0, 2.0); scene.add(rail);
const hd = C.towel(C.fabricMaterial('#a59580'), 0.42, 0.6, 0, 1.38, 0.06); hd.rotation.y = -Math.PI / 2; hd.position.set(room.w, 0, 2.0); scene.add(hd);

const warm = C.KELVIN.warm;
C.spot(scene, 0.75, 0.9, room.h, warm, 4.5, { shadow: true, angle: 0.9 });
C.spot(scene, mx, 0.55, room.h, warm, 3.2, { shadow: true, angle: 0.7, tz: -0.3 });
C.spot(scene, 2.0, 2.4, room.h, warm, 2.6, { shadow: true });
const vul = new THREE.PointLight('#ffe2c0', 1.2, 0, 2); vul.position.set(2.4, 2.2, 3.0); scene.add(vul);
scene.add(new THREE.HemisphereLight('#efe4d4', '#4f463c', 0.32));

if (C.VIEW === 2) C.viewCamera(camera, [1.5, 1.3, 2.75], [0.45, 0, 0.55], -0.1, 54);
else C.viewCamera(camera, [3.3, 1.4, 3.85], [1.2, 0, 0.3], -0.035, 58);
await C.finish(renderer, scene, camera, `b4-wellness-badkamer-${C.VIEW}`, { aoRadius: 0.45, aoIntensity: 1.25, envScale: 0.6 });
</script>
</body>
</html>
