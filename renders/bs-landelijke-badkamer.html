<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>Render · landelijke badkamer</title>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
</head>
<body>
<script type="module">
import * as C from './bs-common.js';
const { THREE } = C;
C.pageStyle();

// Landelijke badkamer: groene handgemaakte (zellige-achtige) tegels tot halverwege de wand,
// kalkverf erboven, cementtegel-look op de vloer, vrijstaand bad, eiken meubel op pootjes,
// messing kranen en warm licht.
const room = { w: 3.4, d: 3.8, h: 2.6 };
const { renderer, scene, camera } = C.setup({ exposure: 0.95, fov: 56 });

const zellige = C.tileMaterial({ pattern: 'grid', tw: 0.1, th: 0.1, joint: 0.002, base: '#3f7a62', varL: 0.06, varS: 0.06, varH: 0.012, grout: '#e3ddd0', gloss: 0.08, seed: 12, surface: C.SURF.zellige, wobble: 0.5, bevel: 3, normalStrength: 4, periodX: 0.8, periodY: 0.8, clearcoat: 0.6, normalScale: 0.9 });
const kalk = C.plasterMaterial('#ece6da', { cloud: 0.035 });
const vloer = C.tileMaterial({ pattern: 'grid', tw: 0.2, th: 0.2, joint: 0.002, base: '#e9e4d8', varL: 0.01, grout: '#cfc8ba', gloss: 0.55, seed: 3, surface: C.SURF.cement('#6d7d74', '#ebe5d8'), periodX: 0.8, periodY: 0.8, normalScale: 0.5 });
const plafond = C.plasterMaterial('#f1ece3', { cloud: 0.02 });
const eiken = C.woodMaterial({ base: '#b88c5c', seed: 21, size: 0.8, contrast: 0.2, roughness: 0.6, gaps: true });
const messing = C.metalMaterial('messing');

C.floorCeil(scene, room, vloer, plafond);
const raam = { u0: 1.3, u1: 2.2, v0: 1.4, v1: 2.3 };
const tegelH = 1.25;
C.wall(scene, room, 'back', zellige, kalk, tegelH, []);
C.wall(scene, room, 'left', zellige, kalk, tegelH, [raam]);
C.wall(scene, room, 'right', zellige, kalk, tegelH, []);
// afsluitlijstje boven de tegels
const lijst = C.matteMaterial('#3a6e58', 0.25);
scene.add(C.boxMM(0, tegelH, 0, room.w, tegelH + 0.025, 0.012, lijst));
scene.add(C.boxMM(0, tegelH, 0, 0.012, tegelH + 0.025, room.d, lijst));
scene.add(C.boxMM(room.w - 0.012, tegelH, 0, room.w, tegelH + 0.025, room.d, lijst));
C.windowLight(scene, room, 'left', raam, { frame: '#f3efe6', mullion: true, reveal: kalk, sill: eiken, sunDir: [-1.0, 1.0, 0.5], sun: 5.5, fill: 1.3, glowI: 1.45 });

// vrijstaand bad met staande kraan
const bad = C.bath({ L: 1.7, W: 0.78, H: 0.6 });
bad.position.set(1.15, 0, 0.62); scene.add(bad);
scene.add(C.bathFiller('messing', 2.12, 0.62, -Math.PI / 2));
const kruk = C.stool(eiken, 2.2, 1.3, 0.42, 0.17); scene.add(kruk);
scene.add(C.towelStack([C.fabricMaterial('#f1ece2'), C.fabricMaterial('#b9a68a')], 2.2, 0.42, 1.3, 0.28, 0.2));

// staand eiken meubel met opzetkom, ronde spiegel met messing rand
const mx = 2.82;
const meubel = C.vanity({ type: 'staand', w: 0.9, d: 0.48, top: 0.84, mat: eiken, blad: eiken, bladT: 0.035, sink: 'opzet', bowlR: 0.2, bowlShape: 'rond', drawers: 2, handle: messing, knobs: true, legs: 0.2, legMat: eiken });
meubel.position.set(mx, 0, 0); scene.add(meubel);
// open onderkant: kast eindigt boven de poten, plank onderin
scene.add(C.tap('hoog', 'messing', mx, 0.84, 0.08, 0.2));
const sp = C.mirror(0.72, 0.72, 'rond', messing, 0.025); sp.position.set(mx, 1.6, 0); scene.add(sp);
C.sconce(scene, 'messing', mx - 0.55, 1.65, 0, C.KELVIN.warm, 0.9);
scene.add(C.bottle(C.matteMaterial('#e8e1d3', 0.4), mx - 0.33, 0.84, 0.13, 0.15, 0.03, messing));
// plant op de vloer links voor het raam
scene.add(C.plant(0.3, 2.35, { potMat: C.matteMaterial('#b7764f', 0.85), h: 0.65, seed: 8, potR: 0.14 }));
// handdoekrek messing aan de rechterwand
const rail = C.towelRail('messing', 0, 0.6, 0.55, 1.1, 6); rail.rotation.y = -Math.PI / 2; rail.position.set(room.w, 0, 1.45); scene.add(rail);
const hd = C.towel(C.fabricMaterial('#e6dccb'), 0.45, 0.6, 0, 1.45, 0.06); hd.rotation.y = -Math.PI / 2; hd.position.set(room.w, 0, 1.45); scene.add(hd);

const warm = C.KELVIN.warm;
C.spot(scene, 1.15, 0.35, room.h, warm, 5, { shadow: true, angle: 0.85 });
C.spot(scene, mx, 0.3, room.h, warm, 5, { shadow: true, angle: 0.85 });
C.spot(scene, 1.7, 2.0, room.h, warm, 3.5, {});
scene.add(new THREE.HemisphereLight('#f6efe2', '#6b5f50', 0.2));

C.archCamera(camera, [2.95, 1.35, 3.6], [1.0, 0, 0.3], -0.04);
await C.finish(renderer, scene, camera, 'bs-landelijke-badkamer', { aoRadius: 0.4, aoIntensity: 1.2, envScale: 0.6 });
</script>
</body>
</html>
