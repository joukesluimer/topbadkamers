<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>Render · luxe badkamer</title>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
</head>
<body>
<script type="module">
import * as C from './b4-common.js';
const { THREE } = C;
C.pageStyle();

// Luxe badkamer: ruime badkamer van 4 x 4,2 m. Wand van warm geaderd marmer (calacatta-look) achter het meubel,
// warme greige wanden, grote lichte vloertegels, dubbel meubel in donker eiken met twee kommen,
// vrijstaand bad onder het raam, ruime inloopdouche, goudkleurige kranen en wandlampjes.
const room = { w: 4.0, d: 4.2, h: 2.8 };
const { renderer, scene, camera } = C.setup({ exposure: 0.95, fov: 58 });

const calacatta = C.tileMaterial({ pattern: 'grid', tw: 1.2, th: 2.8, joint: 0.0012, base: '#f3f0ea', varL: 0.005, grout: '#e0dcd4', gloss: 0.08, seed: 501, surface: C.SURF.marmerRijk({ n: 2, vein: '150,120,85', cloud: '205,195,180', warm: '210,180,130', angle: 1.25, strength: 1.0 }), periodX: 2.4, periodY: 2.8, ny: 1, clearcoat: 0.4, normalScale: 0.12, ppm: 700 });
const greige = C.plasterMaterial('#d9d0c4', { cloud: 0.03, seed: 9, roughness: 0.85 });
const vloer = C.tileMaterial({ pattern: 'grid', tw: 1.2, th: 1.2, joint: 0.0015, base: '#dcd6cc', varL: 0.01, grout: '#c9c2b6', gloss: 0.2, seed: 503, surface: C.SURF.betonZacht, periodX: 2.4, periodY: 2.4, clearcoat: 0.45, normalScale: 0.3 });
const plafond = C.plasterMaterial('#f2efea', { cloud: 0.012 });
const donkerEiken = C.woodMaterial({ base: '#5e4433', seed: 505, size: 0.8, contrast: 0.2, roughness: 0.45, clearcoat: 0.3 });
const goud = C.metalMaterial('goud');

C.floorCeil(scene, room, vloer, plafond);
const raam = { u0: 1.9, u1: 3.1, v0: 1.2, v1: 2.45 };
const nis = { u0: 0.25, u1: 1.15, v0: 1.22, v1: 1.5 };
// douche (u < 1.4) en meubelwand in marmer, rest greige
C.wall(scene, room, 'back', (u) => (u < 1.4 ? calacatta : calacatta), (u) => (u < 1.4 ? calacatta : calacatta), 1.2, [nis], 0.12, [1.4]);
C.wall(scene, room, 'left', (u) => (u < 1.35 ? calacatta : greige), (u) => (u < 1.35 ? calacatta : greige), 1.2, [raam], 0.12, [1.35]);
C.wall(scene, room, 'right', greige, greige, room.h, []);
C.niche(scene, nis, vloer, 0.09);
C.windowLight(scene, room, 'left', raam, { frame: '#e6e1d8', reveal: greige, sill: vloer, sunDir: [-1.0, 1.0, 0.4], sun: 5.0, fill: 1.4, glowI: 1.45 });

// ruime inloopdouche
scene.add(C.shower('goud', 0.7, room.h, { armY: 2.25, reach: 0.5, headR: 0.2, mixY: 1.05, handX: 0.34, square: true }));
scene.add(C.drain(0.7, 0.1, 1.1, 'goud'));
const glas = C.glassPanel({ len: 1.2, h: 2.1, wallProfile: goud, stab: goud, stabLen: 1.38, stabSide: 1 });
glas.position.set(1.4, 0, 0); scene.add(glas);
scene.add(C.bottle(C.matteMaterial('#efe8dc', 0.35), 0.45, 1.22, -0.045, 0.17, 0.028, goud));
scene.add(C.bottle(C.matteMaterial('#5a4c40', 0.35), 0.56, 1.22, -0.045, 0.14, 0.026, goud));

// vrijstaand bad onder het raam
const bad = C.bath({ L: 1.75, W: 0.8, H: 0.6 });
bad.rotation.y = Math.PI / 2; bad.position.set(0.72, 0, 2.5); scene.add(bad);
scene.add(C.bathFiller('goud', 0.72, 1.48, 0));
scene.add(C.stool(donkerEiken, 1.45, 3.15, 0.45, 0.16));
scene.add(C.towelStack([C.fabricMaterial('#f2ede4'), C.fabricMaterial('#cbbfae')], 1.45, 0.45, 3.15, 0.26, 0.2));

// dubbel meubel met twee opzetkommen
const mx = 2.7, mw = 1.8, top = 0.88;
const meubel = C.vanity({ type: 'zwevend', w: mw, d: 0.52, h: 0.45, top, mat: donkerEiken, blad: vloer, bladT: 0.05, sink: 'opzet', sinkX: -0.42, bowlR: 0.21, bowlShape: 'rond', bowlScale: [1.0, 0.8], drawers: 2, handle: goud });
meubel.position.set(mx, 0, 0); scene.add(meubel);
{ // tweede kom (zelfde vorm als in vanity)
  const r = 0.21, prof = [[0, 0], [r * 0.45, 0], [r * 0.8, 0.03], [r * 0.97, 0.08], [r, 0.12], [r * 0.95, 0.12], [r * 0.92, 0.08], [r * 0.75, 0.035], [r * 0.4, 0.018], [0, 0.018]];
  const kom = new THREE.Mesh(new THREE.LatheGeometry(prof.map(([a, b]) => new THREE.Vector2(a, b)), 64), C.CERAMIC());
  kom.castShadow = kom.receiveShadow = true; kom.scale.set(1, 1, 0.8); kom.position.set(mx + 0.42, top, 0.52 / 2 + 0.02); scene.add(kom);
}
for (const sx of [-0.42, 0.42]) {
  scene.add(C.tap('wand', 'goud', mx + sx, top, 0, 0.2));
  const sp = C.mirror(0.6, 0.85, 'boog', goud, 0.015); sp.position.set(mx + sx, 1.75, 0); scene.add(sp);
}
C.sconce(scene, 'goud', mx, 1.78, 0, C.KELVIN.warm, 0.8);
C.sconce(scene, 'goud', mx - 0.88, 1.78, 0, C.KELVIN.warm, 0.6);
C.sconce(scene, 'goud', mx + 0.88, 1.78, 0, C.KELVIN.warm, 0.6);
C.ledStrip(scene, mx, top - 0.05 - 0.45 - 0.01, 0.34, mw - 0.1, C.KELVIN.warm, 0.8);
scene.add(C.bottle(C.matteMaterial('#2a2622', 0.35), mx - 0.05, top, 0.14, 0.16, 0.03, goud));
scene.add(C.towelStack([C.fabricMaterial('#f2ede4'), C.fabricMaterial('#f2ede4')], mx + 0.05 + 0.13, top, 0.3, 0.2, 0.18));
const rail = C.towelRail('goud', 0, 0.55, 0.55, 1.2, 8); rail.rotation.y = -Math.PI / 2; rail.position.set(room.w, 0, 1.9); scene.add(rail);
const hd = C.towel(C.fabricMaterial('#e9e1d4'), 0.45, 0.6, 0, 1.48, 0.06); hd.rotation.y = -Math.PI / 2; hd.position.set(room.w, 0, 1.9); scene.add(hd);
scene.add(C.plant(3.75, 0.95, { potMat: C.matteMaterial('#e9e4dc', 0.3), h: 0.85, seed: 507, potR: 0.15, potH: 0.38 }));

const warm = C.KELVIN.warm;
C.spot(scene, 0.7, 0.45, room.h, warm, 5.5, { shadow: true, angle: 0.85 });
C.spot(scene, mx - 0.42, 0.35, room.h, warm, 4.5, { shadow: true, angle: 0.85 });
C.spot(scene, mx + 0.42, 0.35, room.h, warm, 4.5, { shadow: true, angle: 0.85 });
C.spot(scene, 0.8, 2.5, room.h, warm, 4.5, { shadow: true, angle: 0.9 });
C.spot(scene, 2.6, 2.4, room.h, warm, 3.5, {});
scene.add(new THREE.HemisphereLight('#f6f1e8', '#6b6458', 0.22));

if (C.VIEW === 2) C.viewCamera(camera, [1.95, 1.3, 2.05], [2.95, 0, 0], -0.05, 50);
else C.viewCamera(camera, [3.75, 1.45, 4.05], [1.2, 0, 0.6], -0.03, 60);
await C.finish(renderer, scene, camera, `b4-luxe-badkamer-${C.VIEW}`, { aoRadius: 0.45, aoIntensity: 1.2, envScale: 0.6 });
</script>
</body>
</html>
