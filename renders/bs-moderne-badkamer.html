<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>Render · moderne badkamer</title>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
</head>
<body>
<script type="module">
import * as C from './bs-common.js';
const { THREE } = C;
C.pageStyle();

// Moderne badkamer: grote witte wandtegels, antraciet 60x60 op de vloer en in de douche,
// zwevend eiken meubel, mat zwarte kranen, inloopdouche met helder glas, warm licht.
const room = { w: 3.2, d: 3.6, h: 2.6 };
const { renderer, scene, camera } = C.setup({ exposure: 0.92, fov: 56 });

const wit = C.tileMaterial({ pattern: 'grid', tw: 0.6, th: 1.2, joint: 0.0025, base: '#f1efea', varL: 0.008, grout: '#d9d6cf', gloss: 0.22, seed: 2, periodX: 2.4, periodY: 2.4, bevel: 1.5, normalScale: 0.5 });
const antr = (seed) => C.tileMaterial({ pattern: 'grid', tw: 0.6, th: 0.6, joint: 0.003, base: '#4a4c4f', varL: 0.018, grout: '#3b3c3e', gloss: 0.42, seed, surface: C.SURF.betonZacht, periodX: 1.8, periodY: 1.8, speck: 0.04, normalScale: 0.7 });
const vloer = antr(5), douchewand = antr(8);
const plafond = C.plasterMaterial('#f3f2ef', { cloud: 0.015 });
const eiken = C.woodMaterial({ base: '#c09468', seed: 11, size: 0.9, contrast: 0.14, roughness: 0.5 });
const zwart = C.metalMaterial('zwart');

// ruimte
C.floorCeil(scene, room, vloer, plafond);
const raam = { u0: 1.5, u1: 2.3, v0: 1.3, v1: 2.25 };
const nis = { u0: 0.22, u1: 0.82, v0: 1.0, v1: 1.32 };
C.wall(scene, room, 'back', (u) => (u < 1.02 ? douchewand : wit), wit, room.h, [nis], 0.12, [1.02]);
C.wall(scene, room, 'left', (u) => (u < 1.0 ? douchewand : wit), wit, room.h, [raam], 0.12, [1.0]);
C.wall(scene, room, 'right', wit, wit, room.h, []);
C.niche(scene, nis, douchewand, 0.09);
C.windowLight(scene, room, 'left', raam, { frame: '#2a2a2b', reveal: wit, sunDir: [-1.0, 1.0, 0.55], sun: 5.5, fill: 1.2, glowI: 1.5 });

// inloopdouche linksachter
scene.add(C.shower('zwart', 0.52, room.h, { armY: 2.18, reach: 0.4, headR: 0.15, mixY: 1.1, handX: 0.3 }));
scene.add(C.drain(0.52, 0.1, 0.8, 'zwart'));
const glas = C.glassPanel({ len: 1.05, h: 2.0, wallProfile: zwart, stab: zwart, stabLen: 1.02, stabSide: 1 });
glas.position.set(1.02, 0, 0); scene.add(glas);
// flesjes in de nis
const flesMat = C.matteMaterial('#e9e4dc', 0.35);
scene.add(C.bottle(flesMat, 0.38, 1.0, -0.045, 0.17, 0.028, zwart));
scene.add(C.bottle(C.matteMaterial('#3d3a36', 0.35), 0.48, 1.0, -0.045, 0.15, 0.026, zwart));

// zwevend meubel met geïntegreerde wastafel
const mx = 1.98;
const meubel = C.vanity({ type: 'zwevend', w: 1.2, d: 0.46, h: 0.42, top: 0.88, mat: eiken, blad: C.CERAMIC(), sink: 'geintegreerd', drawers: 2, metal: 'zwart', bladT: 0.04 });
meubel.position.set(mx, 0, 0); scene.add(meubel);
scene.add(C.tap('wand', 'zwart', mx, 0.88, 0, 0.17));
C.ledStrip(scene, mx, 0.40, 0.3, 1.1, C.KELVIN.warm, 0.8);
const sp = C.mirror(1.1, 0.75, 'rect', zwart, 0.012); sp.position.set(mx, 1.62, 0); scene.add(sp);
scene.add(C.bottle(C.matteMaterial('#2b2b2b', 0.4), mx + 0.42, 0.88, 0.12, 0.17, 0.03, zwart));
scene.add(C.towelStack([C.fabricMaterial('#e8e3da'), C.fabricMaterial('#e8e3da'), C.fabricMaterial('#9a8f80')], mx - 0.4, 0.88, 0.2, 0.26, 0.2));

// hangtoilet onder het raam (linkerwand)
const wc = C.toilet(); wc.rotation.y = Math.PI / 2; wc.position.set(0, 0, 1.9); scene.add(wc);
const plate = C.flushPlate('zwart', 0, 1.05, 0); plate.rotation.y = Math.PI / 2; plate.position.set(0, 0, 1.9); scene.add(plate);
// handdoekradiator aan de rechterwand
const rail = C.towelRail('zwart', 0, 0.55, 0.5, 1.2, 8); rail.rotation.y = -Math.PI / 2; rail.position.set(room.w, 0, 2.6); scene.add(rail);
const hd = C.towel(C.fabricMaterial('#d9d2c6'), 0.42, 0.55, 0, 1.43, 0.06); hd.rotation.y = -Math.PI / 2; hd.position.set(room.w, 0, 2.6); scene.add(hd);
scene.add(C.plant(2.92, 0.32, { potMat: C.matteMaterial('#2f2f30', 0.7), h: 0.7, seed: 4 }));

// licht
const warm = C.KELVIN.warm;
C.spot(scene, 0.52, 0.35, room.h, warm, 6, { shadow: true, angle: 0.85 });
C.spot(scene, mx - 0.35, 0.3, room.h, warm, 5, { shadow: true, angle: 0.85 });
C.spot(scene, mx + 0.35, 0.3, room.h, warm, 5, { shadow: true, angle: 0.85 });
C.spot(scene, 1.6, 1.9, room.h, warm, 4, {});
scene.add(new THREE.HemisphereLight('#f4f1ec', '#6b665f', 0.2));

C.archCamera(camera, [2.8, 1.35, 3.45], [0.95, 0, 0.25], -0.035);
await C.finish(renderer, scene, camera, 'bs-moderne-badkamer', { aoRadius: 0.4, aoIntensity: 1.2, envScale: 0.6 });
</script>
</body>
</html>
