<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>Render · klassieke badkamer</title>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
</head>
<body>
<script type="module">
import * as C from './bs-common.js';
const { THREE } = C;
C.pageStyle();

// Klassieke badkamer: witte metrotegels in halfsteens verband met lichtgrijze voeg tot 1,5 m,
// zachte grijsgroene verf erboven, marmerlook op de vloer, bad op pootjes, wit meubel met kaders
// en goud- of messingkleurige kranen met kruisgrepen.
const room = { w: 3.4, d: 3.8, h: 2.7 };
const { renderer, scene, camera } = C.setup({ exposure: 0.95, fov: 56 });

const metro = C.tileMaterial({ pattern: 'half', tw: 0.15, th: 0.075, joint: 0.0022, base: '#f4f2ec', varL: 0.012, grout: '#bdbab3', gloss: 0.06, seed: 71, bevel: 5, normalStrength: 2.5, periodX: 0.6, periodY: 0.6, clearcoat: 0.7, normalScale: 0.9 });
const verf = C.plasterMaterial('#c9d0c8', { cloud: 0.02, seed: 4, roughness: 0.85 });
const marmer = C.tileMaterial({ pattern: 'grid', tw: 0.6, th: 0.6, joint: 0.0015, base: '#f1f0ec', varL: 0.008, grout: '#d9d7d2', gloss: 0.12, seed: 73, surface: C.SURF.marmer, periodX: 1.8, periodY: 1.8, clearcoat: 0.5, normalScale: 0.3 });
const plafond = C.plasterMaterial('#f3f2ee', { cloud: 0.015 });
const witLak = new THREE.MeshPhysicalMaterial({ color: '#f1efe9', roughness: 0.35, clearcoat: 0.5, clearcoatRoughness: 0.2, envMapIntensity: 0.8 });
const goud = C.metalMaterial('goud');

C.floorCeil(scene, room, marmer, plafond);
const raam = { u0: 1.35, u1: 2.25, v0: 1.6, v1: 2.45 };
const tegelH = 1.5;
C.wall(scene, room, 'back', metro, verf, tegelH, []);
C.wall(scene, room, 'left', metro, verf, tegelH, [raam]);
C.wall(scene, room, 'right', metro, verf, tegelH, []);
// tegellijst (bies) boven de metrotegels
const bies = new THREE.MeshPhysicalMaterial({ color: '#f2f0ea', roughness: 0.1, clearcoat: 0.8, envMapIntensity: 0.9 });
scene.add(C.boxMM(0, tegelH, 0, room.w, tegelH + 0.03, 0.018, bies));
scene.add(C.boxMM(0, tegelH, 0, 0.018, tegelH + 0.03, room.d, bies));
scene.add(C.boxMM(room.w - 0.018, tegelH, 0, room.w, tegelH + 0.03, room.d, bies));
C.windowLight(scene, room, 'left', raam, { frame: '#f4f2ec', mullion: true, reveal: verf, sill: marmer, sunDir: [-1.0, 0.95, 0.5], sun: 5.5, fill: 1.3, glowI: 1.45 });

// bad op pootjes, met staande badkraan en handdouche
const bad = C.bath({ L: 1.7, W: 0.76, H: 0.58, feet: goud });
bad.position.set(1.15, 0, 0.6); scene.add(bad);
scene.add(C.bathFiller('goud', 2.12, 0.6, -Math.PI / 2));

// wit meubel met kaders, marmer blad met geïntegreerde wasbak, kruiskraan
const mx = 2.82;
const meubel = C.vanity({ type: 'staand', w: 0.9, d: 0.5, top: 0.86, mat: witLak, blad: marmer, bladT: 0.03, bladOver: 0.04, sink: 'geintegreerd', drawers: 2, panel: true, handle: goud, knobs: true, legs: 0.16, legMat: witLak, metal: 'goud' });
meubel.position.set(mx, 0, 0); scene.add(meubel);
scene.add(C.tap('kruis', 'goud', mx, 0.86, 0.07, 0.15));
const sp = C.mirror(0.66, 0.95, 'boog', goud, 0.025); sp.position.set(mx, 1.72, 0); scene.add(sp);
C.sconce(scene, 'goud', mx - 0.52, 1.75, 0, C.KELVIN.warm, 0.8);
C.sconce(scene, 'goud', mx + 0.52 > room.w - 0.08 ? room.w - 0.1 : mx + 0.52, 1.75, 0, C.KELVIN.warm, 0.6);
scene.add(C.bottle(C.matteMaterial('#f2efe8', 0.25), mx - 0.33, 0.86, 0.13, 0.15, 0.03, goud));
// handdoekradiator in goud aan de rechterwand en een kruk
const rail = C.towelRail('goud', 0, 0.55, 0.55, 1.1, 7); rail.rotation.y = -Math.PI / 2; rail.position.set(room.w, 0, 1.5); scene.add(rail);
const hd = C.towel(C.fabricMaterial('#f1ede4'), 0.45, 0.6, 0, 1.43, 0.06); hd.rotation.y = -Math.PI / 2; hd.position.set(room.w, 0, 1.5); scene.add(hd);
scene.add(C.stool(witLak, 2.2, 1.25, 0.45, 0.16));
scene.add(C.towelStack([C.fabricMaterial('#f2eee6'), C.fabricMaterial('#c9d0c8')], 2.2, 0.45, 1.25, 0.28, 0.2));
scene.add(C.plant(0.35, 2.8, { potMat: C.matteMaterial('#f0ede6', 0.3), h: 0.6, seed: 12, potR: 0.14 }));

const warm = C.KELVIN.warm;
C.spot(scene, 1.15, 0.35, room.h, warm, 5, { shadow: true, angle: 0.85 });
C.spot(scene, 1.7, 2.0, room.h, warm, 3.5, {});
scene.add(new THREE.HemisphereLight('#f6f1e8', '#6b6458', 0.2));

C.archCamera(camera, [2.95, 1.4, 3.6], [1.0, 0, 0.3], -0.03);
await C.finish(renderer, scene, camera, 'bs-klassieke-badkamer', { aoRadius: 0.4, aoIntensity: 1.2, envScale: 0.6 });
</script>
</body>
</html>
