<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>Render · voor en na · kleine badkamer</title>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
</head>
<body>
<script type="module">
import * as C from './b5-common.js';
const { THREE } = C;
C.pageStyle();

// Kleine badkamer van 1,8 x 2,3 m. ?v=voor: ingebouwd bad met douchegordijn, beige tegels met sierstrook,
// bruine vloertegels, wastafel op zuil en een tl-buis. ?v=na: inloopdouche op de plek van het bad.
// Camera en afmetingen zijn in beide versies exact gelijk.
const V = new URLSearchParams(location.search).get('v') === 'na' ? 'na' : 'voor';
const room = { w: 1.8, d: 2.3, h: 2.5 };
const { renderer, scene, camera } = C.setup({ exposure: V === 'voor' ? 0.9 : 0.86, fov: 60 });
const raam = { u0: 0.3, u1: 0.75, v0: 1.8, v1: 2.3 };
const mz = 1.3; // plek wastafel aan de rechterwand

if (V === 'voor') {
  const beige = C.tileMaterial({ pattern: 'grid', tw: 0.15, th: 0.15, joint: 0.003, base: '#d9c6a0', varL: 0.025, grout: '#efe8da', gloss: 0.14, seed: 501, periodX: 1.2, periodY: 1.2, bevel: 2.5, surface: C.DECOR.vlek('120,80,40'), clearcoat: 0.6, normalScale: 0.7 });
  const decor = C.tileMaterial({ pattern: 'grid', tw: 0.15, th: 0.15, joint: 0.003, base: '#d9c6a0', varL: 0.01, grout: '#efe8da', gloss: 0.14, seed: 502, periodX: 0.6, periodY: 0.3, bevel: 2.5, surface: C.DECOR.bloem('#7b4a2a', '#c99a4a'), clearcoat: 0.6 });
  const vloer = C.tileMaterial({ pattern: 'grid', tw: 0.1, th: 0.1, joint: 0.003, base: '#7a4c30', varL: 0.04, grout: '#4b3a2e', gloss: 0.35, seed: 503, periodX: 1.0, periodY: 1.0, bevel: 2, speck: 0.05, normalScale: 0.6 });
  const verf = C.plasterMaterial('#efe6cf', { cloud: 0.04 });
  const plafond = C.plasterMaterial('#f1ead8', { cloud: 0.03 });
  C.floorCeil(scene, room, vloer, plafond);
  C.wall(scene, room, 'back', beige, verf, 2.0, []);
  C.wall(scene, room, 'left', beige, verf, 2.0, [raam]);
  C.wall(scene, room, 'right', beige, verf, 2.0, []);
  // sierstrook op 1,35 m
  scene.add(C.boxMM(0, 1.35, 0, room.w, 1.5, 0.004, decor));
  scene.add(C.boxMM(0, 1.35, 0, 0.004, 1.5, room.d, decor));
  scene.add(C.boxMM(room.w - 0.004, 1.35, 0, room.w, 1.5, room.d, decor));
  C.windowLight(scene, room, 'left', raam, { frame: '#8a6a4a', reveal: beige, sunDir: [-1.0, 1.2, 0.5], sun: 2.6, fill: 0.7, glowI: 1.25, glow: '#f3f0e6' });
  // ingebouwd bad over de volle breedte, pergamon, betegelde voorkant
  const bad = C.inbouwBad({ L: room.w, W: 0.75, H: 0.56, bathMat: C.oldCeramic(C.OUD.pergamon), front: beige });
  bad.position.set(room.w / 2, 0, 0); scene.add(bad);
  // badkraan: opbouwmengkraan met twee knoppen en een handdouche op een stang
  const chroom = C.metalMaterial('chroom');
  scene.add(C.box(0.22, 0.05, 0.05, chroom, 1.3, 0.78, 0.035));
  for (const sx of [-0.12, 0.12]) { const k = C.cyl(0.028, 0.028, 0.05, C.matteMaterial('#f4f1ea', 0.25), 1.3 + sx, 0.78, 0.06, 6); k.rotation.x = Math.PI / 2; scene.add(k); }
  scene.add(C.tube([[1.3, 0.76, 0.06], [1.3, 0.73, 0.12], [1.3, 0.70, 0.16]], 0.012, chroom));
  scene.add(C.cyl(0.011, 0.011, 0.7, chroom, 1.55, 1.45, 0.04, 16));
  scene.add(C.cyl(0.016, 0.02, 0.2, chroom, 1.55, 1.62, 0.075, 20));
  scene.add(C.tube([[1.3, 0.78, 0.06], [1.42, 0.62, 0.2], [1.6, 0.66, 0.3], [1.62, 1.0, 0.2], [1.56, 1.5, 0.08]], 0.007, chroom, 64));
  // douchegordijn, half dichtgetrokken, aan een roede over de volle breedte
  const gord = C.curtain(0.04, 0.95, 0.72, 2.0, 0.6, { base: '#efe3cb', stripes: ['#b98c5e', '#8fb0b6'], railLen: room.w, railX: room.w / 2, folds: 0.09 });
  scene.add(gord);
  // shampooflessen op de badrand
  scene.add(C.bottle(C.matteMaterial('#3f7fa8', 0.35), 0.95, 0.56, 0.05, 0.2, 0.03));
  scene.add(C.bottle(C.matteMaterial('#e8b04a', 0.35), 1.05, 0.56, 0.05, 0.16, 0.028));
  // wastafel op een zuil, met twee losse kranen, kale spiegel en tl-buis
  const wt = C.zuilWastafel(C.oldCeramic(C.OUD.pergamon), { w: 0.52, d: 0.4 });
  wt.rotation.y = -Math.PI / 2; wt.position.set(room.w, 0, mz); scene.add(wt);
  { const k = C.tap('kruis', 'chroom', 0, 0.84, 0.05, 0.12); k.rotation.y = -Math.PI / 2; k.position.set(room.w, 0, mz); scene.add(k); }
  const sp = C.mirror(0.5, 0.6, 'rect', null); sp.rotation.y = -Math.PI / 2; sp.position.set(room.w, 1.45, mz); scene.add(sp);
  // glazen planchet met spullen
  const glasPl = new THREE.MeshPhysicalMaterial({ color: '#cfe5dc', transparent: true, opacity: 0.45, roughness: 0.05 });
  scene.add(C.box(0.12, 0.008, 0.5, glasPl, room.w - 0.06, 1.1, mz));
  scene.add(C.bottle(C.matteMaterial('#d24b6a', 0.3), room.w - 0.05, 1.105, mz - 0.12, 0.13, 0.022));
  scene.add(C.bottle(C.matteMaterial('#f2f0e8', 0.3), room.w - 0.05, 1.105, mz + 0.1, 0.09, 0.03));
  C.tlBuis(scene, 0, 1.86, 0, 0.6, { rotY: -Math.PI / 2, intensity: 1.6, shadow: true }).position.set(room.w, 1.86, mz);
  // badmat
  scene.add(C.rbox(0.6, 0.012, 0.42, 0.02, C.fabricMaterial('#c6a26a'), 0.7, 0.006, 1.15));
  C.bolLamp(scene, room.w / 2, 1.3, room.h, '#ffdcae', 2.4);
  scene.add(new THREE.HemisphereLight('#f4efe2', '#6a5a48', 0.3));
} else {
  const wit = C.tileMaterial({ pattern: 'grid', tw: 0.3, th: 0.6, joint: 0.002, base: '#f0eeea', varL: 0.008, grout: '#d9d6d0', gloss: 0.12, seed: 511, periodX: 1.2, periodY: 1.2, bevel: 1.5, clearcoat: 0.5, normalScale: 0.5 });
  const accent = C.tileMaterial({ pattern: 'grid', tw: 0.075, th: 0.3, joint: 0.002, base: '#9aa79a', varL: 0.03, grout: '#c9cbc4', gloss: 0.1, seed: 512, periodX: 0.6, periodY: 1.2, bevel: 2, clearcoat: 0.8, normalScale: 0.7 });
  const vloer = C.tileMaterial({ pattern: 'grid', tw: 0.6, th: 0.6, joint: 0.002, base: '#b2aea6', varL: 0.015, grout: '#9f9b94', gloss: 0.45, seed: 513, surface: C.SURF.betonZacht, periodX: 1.2, periodY: 1.2, speck: 0.03, normalScale: 0.5 });
  const plafond = C.plasterMaterial('#f4f3f0', { cloud: 0.015 });
  C.floorCeil(scene, room, vloer, plafond);
  const nis = { u0: 0.25, u1: 0.75, v0: 1.0, v1: 1.3 };
  // achterwand in de douche met smalle groene tegels, de rest licht
  C.wall(scene, room, 'back', accent, accent, room.h, [nis]);
  C.wall(scene, room, 'left', wit, wit, room.h, [raam]);
  C.wall(scene, room, 'right', wit, wit, room.h, []);
  C.niche(scene, nis, accent, 0.09);
  C.windowLight(scene, room, 'left', raam, { frame: '#f2f1ee', reveal: wit, sunDir: [-1.0, 1.2, 0.5], sun: 3.4, fill: 0.9, glowI: 1.45 });
  // inloopdouche over de volle breedte waar het bad stond, goot langs de achterwand
  scene.add(C.shower('zwart', 0.55, room.h, { armY: 2.12, reach: 0.36, headR: 0.15, mixY: 1.05, handX: 0.3, mixW: 0.3 }));
  scene.add(C.drain(0.55, 0.08, 0.9, 'zwart'));
  const glas = C.glassPanel({ len: 0.95, h: 2.0, wallProfile: C.metalMaterial('zwart') });
  glas.position.set(1.12, 0, 0); scene.add(glas);
  // planchet in eiken naast de douche
  scene.add(C.box(0.6, 0.04, 0.18, C.woodMaterial({ base: '#b88c5e', seed: 516, size: 0.6 }), 1.48, 1.2, 0.09));
  scene.add(C.plant(1.36, 0.09, { y: 1.22, potH: 0.12, potR: 0.06, h: 0.28, leaves: 8 }));
  scene.add(C.towelStack([C.fabricMaterial('#e9e4da'), C.fabricMaterial('#c9cfc4')], 1.62, 1.22, 0.1, 0.24, 0.16));
  scene.add(C.bottle(C.matteMaterial('#ffffff', 0.3), 0.4, 1.0, -0.045, 0.15, 0.026, C.metalMaterial('zwart')));
  scene.add(C.bottle(C.matteMaterial('#5b6b5a', 0.3), 0.5, 1.0, -0.045, 0.13, 0.024, C.metalMaterial('zwart')));
  // zwevend eiken meubel met spiegel aan de rechterwand
  const eiken = C.woodMaterial({ base: '#b88c5e', seed: 514, size: 0.6, contrast: 0.18, roughness: 0.5 });
  const meubel = C.vanity({ type: 'zwevend', w: 0.6, d: 0.42, h: 0.42, top: 0.86, mat: eiken, blad: C.CERAMIC(), body: C.matteMaterial('#f2f1ee', 0.4), sink: 'geintegreerd', drawers: 1, metal: 'zwart', bladT: 0.035, handle: null });
  meubel.rotation.y = -Math.PI / 2; meubel.position.set(room.w, 0, mz); scene.add(meubel);
  const kraan = C.tap('hoog', 'zwart', 0, 0.86, 0.06, 0.16); kraan.rotation.y = -Math.PI / 2; kraan.position.set(room.w, 0, mz); scene.add(kraan);
  const sp = C.mirror(0.6, 0.8, 'rect', null); sp.rotation.y = -Math.PI / 2; sp.position.set(room.w, 1.5, mz); scene.add(sp);
  C.ledStrip(scene, room.w - 0.25, 0.4, mz, 0.5, '#ffe2c0', 0.6).rotation.y = Math.PI / 2;
  // handdoekradiator aan de linkerwand, vooraan
  const rad = C.towelRail('zwart', 0, 0.45, 0.45, 0.9, 7); rad.rotation.y = Math.PI / 2; rad.position.set(0, 0, 1.45); scene.add(rad);
  const linnen = C.fabricMaterial('#e9e4da');
  const hd = C.towel(linnen, 0.38, 0.45, 0, 1.15, 0.07); hd.rotation.y = Math.PI / 2; hd.position.set(0, 0, 1.45); scene.add(hd);
  // houten douchemat
  const teak = C.woodMaterial({ base: '#a7784c', seed: 515, size: 0.5, contrast: 0.2, roughness: 0.6 });
  for (let i = 0; i < 7; i++) scene.add(C.box(0.06, 0.02, 0.45, teak, 0.62 + i * 0.075, 0.025, 1.2));
  const koel = C.KELVIN.neutraal;
  C.spot(scene, 0.9, 0.45, room.h, koel, 5, { shadow: true, angle: 0.85 });
  C.spot(scene, 1.3, 1.55, room.h, koel, 4, { shadow: true, angle: 0.9 });
  scene.add(new THREE.HemisphereLight('#f2f4f6', '#6a6a68', 0.25));
}

C.archCamera(camera, [0.9, 1.45, 3.0], [0.9, 0, 0], -0.12);
await C.finish(renderer, scene, camera, `b5-kleine-badkamer-${V}`, { aoRadius: 0.3, aoIntensity: 1.2, envScale: 0.6 });
</script>
</body>
</html>
