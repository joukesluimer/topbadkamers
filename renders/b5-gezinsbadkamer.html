<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>Render · voor en na · gezinsbadkamer</title>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
</head>
<body>
<script type="module">
import * as C from './b5-common.js';
const { THREE } = C;
C.pageStyle();

// Gezinsbadkamer van 3,0 x 2,7 m. ?v=voor: bad met douchegordijn, staand toilet, één wastafel met spiegelkast
// en tl-buis, crème tegels met bruine strook. ?v=na: bad met glazen badwand en regendouche, hangtoilet,
// dubbel wastafelmeubel van 140 cm met lange spiegel. Camera en afmetingen in beide versies gelijk.
const V = new URLSearchParams(location.search).get('v') === 'na' ? 'na' : 'voor';
const room = { w: 3.0, d: 2.7, h: 2.6 };
const { renderer, scene, camera } = C.setup({ exposure: 0.88, fov: 60 });
const raam = { u0: 0.7, u1: 1.5, v0: 1.3, v1: 2.2 };
const mz = 1.55; // midden wastafel(s) aan de rechterwand

if (V === 'voor') {
  const creme = C.tileMaterial({ pattern: 'grid', tw: 0.15, th: 0.2, joint: 0.003, base: '#e6d9bb', varL: 0.02, grout: '#f2ede2', gloss: 0.14, seed: 561, periodX: 1.2, periodY: 1.2, bevel: 2.5, surface: C.DECOR.vlek('130,95,50'), clearcoat: 0.6, normalScale: 0.7 });
  const band = C.tileMaterial({ pattern: 'grid', tw: 0.15, th: 0.075, joint: 0.003, base: '#7b4a2c', varL: 0.04, grout: '#efe8da', gloss: 0.1, seed: 562, periodX: 0.6, periodY: 0.3, bevel: 2, clearcoat: 0.8 });
  const vloer = C.tileMaterial({ pattern: 'grid', tw: 0.15, th: 0.15, joint: 0.003, base: '#9a5a3a', varL: 0.05, grout: '#5a4536', gloss: 0.35, seed: 563, periodX: 1.2, periodY: 1.2, bevel: 2, speck: 0.05 });
  const verf = C.plasterMaterial('#f0e8d4', { cloud: 0.035 });
  C.floorCeil(scene, room, vloer, verf);
  C.wall(scene, room, 'back', creme, verf, 2.0, []);
  C.wall(scene, room, 'left', creme, verf, 2.0, [raam]);
  C.wall(scene, room, 'right', creme, verf, 2.0, []);
  scene.add(C.boxMM(0, 1.2, 0, room.w, 1.275, 0.004, band));
  scene.add(C.boxMM(0, 1.2, 0, 0.004, raam.v0, room.d, band));
  scene.add(C.boxMM(room.w - 0.004, 1.2, 0, room.w, 1.275, room.d, band));
  C.windowLight(scene, room, 'left', raam, { frame: '#8a6a4a', reveal: creme, sill: C.matteMaterial('#7b4a2c', 0.3), sunDir: [-1.0, 1.1, 0.4], sun: 2.6, fill: 1.0, glowI: 1.3, glow: '#f3f0e6', mullion: true });
  // bad links tegen de achterwand, met douchegordijn
  const bad = C.inbouwBad({ L: 1.7, W: 0.75, H: 0.56, bathMat: C.oldCeramic(C.OUD.bahama), front: creme, endRight: true });
  bad.position.set(0.85, 0, 0); scene.add(bad);
  const chroom = C.metalMaterial('chroom');
  scene.add(C.box(0.22, 0.05, 0.05, chroom, 0.9, 0.78, 0.035));
  for (const sx of [-0.12, 0.12]) { const k = C.cyl(0.028, 0.028, 0.05, C.matteMaterial('#f4f1ea', 0.25), 0.9 + sx, 0.78, 0.06, 6); k.rotation.x = Math.PI / 2; scene.add(k); }
  scene.add(C.tube([[0.9, 0.76, 0.06], [0.9, 0.73, 0.12], [0.9, 0.70, 0.16]], 0.012, chroom));
  scene.add(C.cyl(0.011, 0.011, 0.7, chroom, 1.2, 1.45, 0.04, 16));
  scene.add(C.cyl(0.016, 0.02, 0.2, chroom, 1.2, 1.62, 0.075, 20));
  scene.add(C.curtain(1.0, 1.68, 0.72, 2.0, 0.6, { base: '#f1ead8', stripes: ['#c08550', '#7f9c7b'], railLen: 1.7, railX: 0.85, folds: 0.08 }));
  // staand toilet rechts van het bad
  const wc = C.oldToilet(C.oldCeramic(C.OUD.bahama), C.matteMaterial('#cdb38a', 0.35)); wc.position.set(2.35, 0, 0); scene.add(wc);
  scene.add(C.rolHouder('chroom', 2.75, 0.75, 0));
  // één wastafel op zuil met spiegelkast en tl-buis aan de rechterwand
  const wt = C.zuilWastafel(C.oldCeramic(C.OUD.bahama), { w: 0.6, d: 0.45 }); wt.rotation.y = -Math.PI / 2; wt.position.set(room.w, 0, mz); scene.add(wt);
  { const k = C.tap('kruis', 'chroom', 0, 0.84, 0.06, 0.12); k.rotation.y = -Math.PI / 2; k.position.set(room.w, 0, mz); scene.add(k); }
  const kast = C.box(0.6, 0.6, 0.14, C.matteMaterial('#efe9dc', 0.35), 0, 0, 0); kast.rotation.y = -Math.PI / 2; kast.position.set(room.w - 0.07, 1.5, mz); scene.add(kast);
  const sp = C.mirror(0.28, 0.54, 'rect', null); sp.rotation.y = -Math.PI / 2; sp.position.set(room.w - 0.14, 1.5, mz - 0.145); scene.add(sp);
  const sp2 = C.mirror(0.28, 0.54, 'rect', null); sp2.rotation.y = -Math.PI / 2; sp2.position.set(room.w - 0.14, 1.5, mz + 0.145); scene.add(sp2);
  C.tlBuis(scene, room.w, 1.88, mz, 0.6, { rotY: -Math.PI / 2, intensity: 1.6, shadow: true }).position.set(room.w, 1.88, mz);
  scene.add(C.rbox(0.6, 0.012, 0.42, 0.02, C.fabricMaterial('#c6a26a'), 1.1, 0.006, 1.05));
  scene.add(C.rbox(0.4, 0.012, 0.6, 0.02, C.fabricMaterial('#c6a26a'), 2.6, 0.006, mz));
  C.bolLamp(scene, 1.5, 1.4, room.h, '#ffdcae', 2.8);
  scene.add(new THREE.HemisphereLight('#f4efe2', '#6a5a48', 0.3));
} else {
  const wit = C.tileMaterial({ pattern: 'grid', tw: 0.3, th: 0.6, joint: 0.002, base: '#f0eeea', varL: 0.008, grout: '#d9d6d0', gloss: 0.12, seed: 571, periodX: 1.2, periodY: 1.2, bevel: 1.5, clearcoat: 0.5, normalScale: 0.5 });
  const marmer = C.tileMaterial({ pattern: 'grid', tw: 0.6, th: 1.2, joint: 0.0015, base: '#f1efeb', varL: 0.005, grout: '#e3e0da', gloss: 0.06, seed: 572, surface: C.SURF.marmer, periodX: 1.2, periodY: 2.4, clearcoat: 1, normalScale: 0.3 });
  const vloer = C.tileMaterial({ pattern: 'grid', tw: 0.6, th: 0.6, joint: 0.002, base: '#bdb6aa', varL: 0.015, grout: '#a8a196', gloss: 0.45, seed: 573, surface: C.SURF.betonZacht, periodX: 1.2, periodY: 1.2, speck: 0.03, normalScale: 0.5 });
  const verf = C.plasterMaterial('#f4f3f0', { cloud: 0.015 });
  C.floorCeil(scene, room, vloer, verf);
  C.wall(scene, room, 'back', marmer, marmer, room.h, []);
  C.wall(scene, room, 'left', wit, wit, room.h, [raam]);
  C.wall(scene, room, 'right', wit, wit, room.h, []);
  C.windowLight(scene, room, 'left', raam, { frame: '#2a2a2a', reveal: wit, sill: C.matteMaterial('#e9e4da', 0.3), sunDir: [-1.0, 1.1, 0.4], sun: 3.2, fill: 1.2, glowI: 1.45, mullion: true });
  // bad op dezelfde plek, betegelde voorkant, regendouche erboven en een glazen badwand
  const bad = C.inbouwBad({ L: 1.7, W: 0.75, H: 0.56, bathMat: C.CERAMIC(), front: wit, rimMat: C.matteMaterial('#ece8e1', 0.3), endRight: true });
  bad.position.set(0.85, 0, 0); scene.add(bad);
  scene.add(C.shower('zwart', 0.45, room.h, { armY: 2.15, reach: 0.36, headR: 0.15, mixY: 1.0, handX: 0.3, mixW: 0.3 }));
  scene.add(C.tap('wand', 'zwart', 1.05, 0.5, 0, 0.16));
  const glas = C.glassPanel({ len: 0.75, h: 1.45, y0: 0.58, wallProfile: C.metalMaterial('zwart') });
  glas.position.set(0.95, 0, 0); scene.add(glas);
  // hangtoilet in een voorzetwand met plank
  scene.add(C.boxMM(1.9, 0, 0, room.w, 1.1, 0.18, wit));
  const eiken = C.woodMaterial({ base: '#b88c5e', seed: 574, size: 0.6, contrast: 0.18, roughness: 0.5 });
  scene.add(C.boxMM(1.9, 1.1, 0, room.w, 1.13, 0.2, eiken));
  const wc = C.toilet(); wc.position.set(2.35, 0, 0.18); scene.add(wc);
  scene.add(C.flushPlate('zwart', 2.35, 0.92, 0.18));
  scene.add(C.plant(2.75, 0.1, { y: 1.13, potH: 0.14, potR: 0.07, h: 0.35, leaves: 9 }));
  // dubbel wastafelmeubel van 140 cm met twee opzetkommen en een lange spiegel
  const opt = { type: 'zwevend', w: 1.4, d: 0.46, h: 0.45, top: 0.88, mat: eiken, blad: C.matteMaterial('#ece8e1', 0.3), sink: 'opzet', bowlShape: 'rond', bowlR: 0.18, drawers: 1, handle: null };
  const meubel = C.vanity({ ...opt, sinkX: -0.35 });
  const v2 = C.vanity({ ...opt, sinkX: 0.35 }); meubel.add(v2.children[v2.children.length - 1]);
  meubel.rotation.y = -Math.PI / 2; meubel.position.set(room.w, 0, mz); scene.add(meubel);
  for (const dz of [-0.35, 0.35]) { const k = C.tap('wand', 'zwart', 0, 0.88, 0, 0.17); k.rotation.y = -Math.PI / 2; k.position.set(room.w, 0, mz + dz); scene.add(k); }
  const sp = C.mirror(1.3, 0.75, 'rect', null); sp.rotation.y = -Math.PI / 2; sp.position.set(room.w, 1.6, mz); scene.add(sp);
  C.ledStrip(scene, room.w - 0.23, 0.42, mz, 1.3, '#ffe2c0', 0.8).rotation.y = Math.PI / 2;
  const rad = C.towelRail('zwart', 0, 0.4, 0.5, 1.0, 8); rad.rotation.y = Math.PI / 2; rad.position.set(0, 0, 2.05); scene.add(rad);
  const hd = C.towel(C.fabricMaterial('#e9e4da'), 0.42, 0.5, 0, 1.2, 0.07); hd.rotation.y = Math.PI / 2; hd.position.set(0, 0, 2.05); scene.add(hd);
  C.spot(scene, 0.85, 0.5, room.h, C.KELVIN.neutraal, 4, { shadow: true, angle: 0.85 });
  C.spot(scene, 2.35, 0.6, room.h, C.KELVIN.neutraal, 3, { shadow: true, angle: 0.85 });
  C.spot(scene, 2.4, mz, room.h, C.KELVIN.neutraal, 4, { shadow: true, angle: 0.9 });
  scene.add(new THREE.HemisphereLight('#f2f4f6', '#6a6a68', 0.3));
}

C.archCamera(camera, [1.5, 1.5, 3.7], [1.5, 0, 0], -0.1);
await C.finish(renderer, scene, camera, `b5-gezinsbadkamer-${V}`, { aoRadius: 0.3, aoIntensity: 1.1, envScale: 0.6 });
</script>
</body>
</html>
