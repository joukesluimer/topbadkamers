<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>Render · tegelwerk badkamer</title>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
</head>
<body>
<script type="module">
import * as C from './bd-common.js';
const { THREE, MAT } = C;
C.pageStyle();

// Tegelwerk: een wand die half betegeld is. Tegelkruisjes in de voegen, gekamde lijm
// voor de volgende rij, een lijmkam op de emmer en een stapel tegels op de vloer.
const { renderer, scene, camera } = C.setup({ exposure: 0.85 });
const W = 2.6, D = 2.4, H = 2.6;

const board = C.boardMaterial('#b9bebc', 3);
const screed = C.microcementMaterial('#a39e95', 8, 2);
const plaster = C.plasterMaterial('#efede8');

const R = C.room(scene, {
  W, D, H,
  walls: { back: board, left: board, right: board, front: board },
  floor: screed, ceil: plaster,
  windows: [{ wall: 'left', a0: 1.0, a1: 1.9, y0: 1.15, y1: 2.15, frame: '#f2f2f0', glow: 5 }],
});

// tegels 60x30 cm, voeg 3 mm, recht verband
const tw = 0.6, th = 0.3, j = 0.003, tt = 0.009, glue = 0.004;
const tileMats = [0, 1, 2, 3].map((i) => new THREE.MeshPhysicalMaterial({ color: new THREE.Color('#efede7').offsetHSL(0, 0, (i - 1.5) * 0.006), roughness: 0.16, clearcoat: 0.4, clearcoatRoughness: 0.1, envMapIntensity: 0.8 }));
const crossMat = MAT.plastic('#6fa7d6');
const R0 = C.rng(17);
const placed = [];
const rows = 5;
for (let r = 0; r < rows; r++) {
  const y = j + r * (th + j);
  for (let i = 0; i < 5; i++) {
    if (r === 4 && i > 1) continue; // laatste rij is half gezet
    const x = i * (tw + j);
    const wdt = Math.min(tw, W - x);
    if (wdt < 0.02) continue;
    const m = C.rbox(wdt, th, tt, 0.0012, tileMats[(r * 5 + i) % 4], x + wdt / 2, y + th / 2, glue + tt / 2 + (R0() - 0.5) * 0.0006);
    scene.add(m);
    placed.push([x, y, wdt]);
  }
}
// lijm achter de tegels (zichtbaar in de open voegen)
const glueFlat = C.adhesiveMaterial('#8f8d88', false, 4);
scene.add(C.box(W, 4 * (th + j) + j, glue, glueFlat, W / 2, (4 * (th + j) + j) / 2, glue / 2, { cast: false }));
scene.add(C.box(2 * (tw + j), th + j, glue, glueFlat, (tw + j), 4 * (th + j) + (th + j) / 2, glue / 2, { cast: false }));
// gekamde lijm voor de volgende tegels
const ribbed = C.adhesiveMaterial('#94928c', true, 5);
scene.add(C.box(W - 2 * (tw + j) - 0.02, th - 0.02, 0.006, ribbed, (2 * (tw + j) + W - 0.02) / 2 + 0.005, 4 * (th + j) + j + th / 2, 0.003, { cast: true }));

// tegelkruisjes op de kruispunten
for (let r = 1; r <= 4; r++) {
  const y = r * (th + j) + j / 2 - 0.0015;
  for (let i = 1; i <= 4; i++) {
    const x = i * (tw + j) - j / 2;
    if (r === 4 && i > 2) continue;
    if (x > W - 0.02) continue;
    const c = C.tileCross(0.032, j * 0.95, crossMat, 0.012);
    c.position.set(x, y + 0.0015, glue + tt);
    c.rotation.z = (R0() - 0.5) * 0.04;
    scene.add(c);
  }
}
// T-stukjes boven de bovenste half gezette rij
for (const i of [1, 2]) {
  const c = C.tileCross(0.032, j * 0.95, crossMat, 0.012);
  c.position.set(i * (tw + j) - j / 2, 5 * (th + j) - j / 2, glue + tt);
  scene.add(c);
}
// een paar losse kruisjes op de vloer
for (let k = 0; k < 7; k++) {
  const c = C.tileCross(0.032, j * 0.95, crossMat, 0.012);
  c.rotation.x = -Math.PI / 2;
  c.rotation.z = R0() * Math.PI;
  c.position.set(1.42 + R0() * 0.3, 0.003, 0.72 + R0() * 0.25);
  scene.add(c);
}

// stapel tegels
const stack = C.tileStack(tileMats[1], tw, th, 9, 0.009, 4);
stack.position.set(0.62, 0, 0.7);
stack.rotation.y = 0.06;
scene.add(stack);
// emmer met lijm, lijmkam op de rand
const b = C.bucket('#9a9892');
b.position.set(1.95, 0, 0.62);
scene.add(b);
const trowel = C.notchedTrowel();
trowel.position.set(1.93, 0.318, 0.62);
trowel.rotation.set(0.0, 0.5, 0.06);
scene.add(trowel);
// waterpas tegen de tegels
const lvl = C.spiritLevel();
lvl.rotation.set(-0.12, 0, Math.PI / 2);
lvl.position.set(2.3, 0.3, 0.06);
scene.add(lvl);

C.downlight(scene, 1.3, 0.9, H, { intensity: 1.6 });
C.autoLights(scene, R, { window: 15, bounce: 6, colors: { floor: '#b9b4ab', left: '#b8bdbb', right: '#b8bdbb', back: '#c9cbc6', front: '#b8bdbb' } });

C.lookCamera(camera, [1.72, 1.08, 2.3], [1.12, 0.66, 0.0], 50);
await C.finish(renderer, scene, camera, 'bd-tegelwerk-badkamer', { envPos: [1.3, 1.2, 1.2], frames: 64, envBoost: 0.6, envAmbient: 1.0, hemi: 0.03 });
</script>
</body>
</html>
