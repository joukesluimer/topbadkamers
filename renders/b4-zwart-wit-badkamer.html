<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>Render · zwart-wit badkamer</title>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
</head>
<body>
<script type="module">
import * as C from './b4-common.js';
const { THREE } = C;
C.pageStyle();

// Zwart-wit badkamer: witte metrotegels in halfsteens verband, zwart-wit dambordvloer,
// douchewand met zwart profiel en roeden, mat zwart meubel en kranen, witte verf boven de tegels.
const room = { w: 3.2, d: 3.6, h: 2.6 };
const { renderer, scene, camera } = C.setup({ exposure: 0.98, fov: 56 });

const metro = C.tileMaterial({ pattern: 'half', tw: 0.2, th: 0.1, joint: 0.0025, base: '#f6f5f1', varL: 0.01, grout: '#3a3a3a', gloss: 0.06, seed: 31, bevel: 5, normalStrength: 2.5, periodX: 0.8, periodY: 0.8, clearcoat: 0.7, normalScale: 0.9 });
const verf = C.plasterMaterial('#f2f1ee', { cloud: 0.012, seed: 6 });
const dambord = C.tileMaterial({ pattern: 'grid', tw: 0.3, th: 0.3, joint: 0.0018, base: '#f1f0ec', base2: '#1f1f20', varL: 0.012, grout: '#8a8986', gloss: 0.18, seed: 33, surface: C.SURF.marmerRijk({ n: 1, vein: '150,150,155', strength: 0.5, branches: 2, fine: 3 }), surface2: null, periodX: 1.2, periodY: 1.2, clearcoat: 0.5, normalScale: 0.4 });
const plafond = C.plasterMaterial('#f4f4f2', { cloud: 0.01 });
const zwartMat = new THREE.MeshPhysicalMaterial({ color: '#1c1c1d', roughness: 0.55, clearcoat: 0.25, envMapIntensity: 0.6 });
const zwart = C.metalMaterial('zwart');
const eiken = C.woodMaterial({ base: '#b58c62', seed: 35, size: 0.9, contrast: 0.14, roughness: 0.5 });

C.floorCeil(scene, room, dambord, plafond);
const raam = { u0: 1.5, u1: 2.4, v0: 1.3, v1: 2.3 };
const tegelH = 1.35;
C.wall(scene, room, 'back', metro, (u) => (u < 1.02 ? metro : verf), tegelH, [], 0.12, [1.02]);
C.wall(scene, room, 'left', metro, (u) => (u < 1.0 ? metro : verf), tegelH, [raam], 0.12, [1.0]);
C.wall(scene, room, 'right', metro, verf, tegelH, []);
// zwarte bies boven de tegels
const bies = new THREE.MeshPhysicalMaterial({ color: '#141414', roughness: 0.25, clearcoat: 0.8 });
scene.add(C.boxMM(1.02, tegelH, 0, room.w, tegelH + 0.025, 0.014, bies));
scene.add(C.boxMM(0, tegelH, 1.0, 0.014, tegelH + 0.025, room.d, bies));
scene.add(C.boxMM(room.w - 0.014, tegelH, 0, room.w, tegelH + 0.025, room.d, bies));
C.windowLight(scene, room, 'left', raam, { frame: '#1d1d1e', mullion: true, reveal: verf, sill: C.matteMaterial('#1d1d1e', 0.4), sunDir: [-1.0, 1.0, 0.5], sun: 5.5, fill: 1.4, glowI: 1.5 });

scene.add(C.shower('zwart', 0.52, room.h, { armY: 2.15, reach: 0.4, headR: 0.15, mixY: 1.05, handX: 0.3, exposed: true }));
scene.add(C.drain(0.52, 0.1, 0.8, 'zwart'));
const glas = C.glassPanel({ len: 1.0, h: 2.0, profileMat: zwart, profileW: 0.022, bars: [0.33, 0.66], vbars: [0.5] });
glas.position.set(1.02, 0, 0); scene.add(glas);

const mx = 2.0;
const meubel = C.vanity({ type: 'staand', w: 0.9, d: 0.48, top: 0.86, mat: zwartMat, blad: C.CERAMIC(), bladT: 0.03, sink: 'geintegreerd', drawers: 2, handle: zwart, legs: 0.18, legMat: zwart, metal: 'zwart' });
meubel.position.set(mx, 0, 0); scene.add(meubel);
scene.add(C.tap('hoog', 'zwart', mx, 0.86, 0.06, 0.17));
const sp = C.mirror(0.62, 0.9, 'boog', zwart, 0.015); sp.position.set(mx, 1.88, 0); scene.add(sp);
C.sconce(scene, 'zwart', mx - 0.45, 1.85, 0, C.KELVIN.warm, 0.6);
C.sconce(scene, 'zwart', mx + 0.45, 1.85, 0, C.KELVIN.warm, 0.6);
scene.add(C.bottle(C.matteMaterial('#f3f2ee', 0.3), mx + 0.3, 0.86, 0.13, 0.15, 0.03, zwart));
const rail = C.towelRail('zwart', 0, 0.5, 0.5, 1.2, 8); rail.rotation.y = -Math.PI / 2; rail.position.set(room.w, 0, 1.55); scene.add(rail);
const hd = C.towel(C.fabricMaterial('#f2f1ed'), 0.42, 0.55, 0, 1.38, 0.06); hd.rotation.y = -Math.PI / 2; hd.position.set(room.w, 0, 1.55); scene.add(hd);
scene.add(C.stool(eiken, 2.85, 0.75, 0.45, 0.15));
scene.add(C.towelStack([C.fabricMaterial('#222222'), C.fabricMaterial('#f2f1ed')], 2.85, 0.45, 0.75, 0.26, 0.2));
scene.add(C.plant(2.9, 0.3, { potMat: C.matteMaterial('#1d1d1e', 0.5), h: 0.65, seed: 37, potR: 0.13 }));

const wc = C.toilet(); wc.rotation.y = Math.PI / 2; wc.position.set(0, 0, 2.0); scene.add(wc);
const plate = C.flushPlate('zwart', 0, 1.05, 0); plate.rotation.y = Math.PI / 2; plate.position.set(0, 0, 2.0); scene.add(plate);

const warm = C.KELVIN.warm;
C.spot(scene, 0.52, 0.35, room.h, warm, 5, { shadow: true, angle: 0.85 });
C.spot(scene, mx, 0.35, room.h, warm, 4.5, { shadow: true, angle: 0.85 });
C.spot(scene, 1.6, 1.9, room.h, warm, 4, { shadow: true });
scene.add(new THREE.HemisphereLight('#f4f2ee', '#666', 0.25));

if (C.VIEW === 2) C.viewCamera(camera, [1.3, 1.3, 2.45], [1.95, 0, 0.2], -0.32, 56);
else C.viewCamera(camera, [2.8, 1.35, 3.45], [0.95, 0, 0.25], -0.035);
await C.finish(renderer, scene, camera, `b4-zwart-wit-badkamer-${C.VIEW}`, { aoRadius: 0.4, aoIntensity: 1.2, envScale: 0.6 });
</script>
</body>
</html>
